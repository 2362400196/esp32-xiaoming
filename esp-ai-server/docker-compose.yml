# ============================================================
# ESP-AI Server - Docker Compose
# ============================================================
# 与多阶段 Dockerfile 对齐：
#   - WORKDIR /app
#   - 源码在 /app/src
#   - 虚拟环境在 /app/.venv
#   - 入口: uvicorn src.main:app --port 8088
#
# 数据目录（务必持久化，否则容器重建即丢）：
#   - /app/data        主数据：SQLite 数据库 (data/espai.db)、插件、备份、微信数据
#   - /app/src/data    设备级数据：技能、记忆等
#   - /app/src/firmware  OTA 固件文件
#   - /app/src/emos    表情包静态资源
#   - /app/logs        运行日志
# ============================================================

services:
  esp-ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp-ai-server:latest
    container_name: esp-ai-server
    restart: unless-stopped

    ports:
      - "8088:8088"

    # 从 .env 读取全部配置（ASR/LLM/TTS 密钥、JWT_SECRET、数据库路径等）
    env_file:
      - .env

    # 数据持久化：全部使用命名卷（跨平台、权限友好、升级不丢数据）
    # 如需直接访问数据目录，可把命名卷改为 bind mount，例如：
    #   - ./data:/app/data
    volumes:
      - esp-ai-data:/app/data
      - esp-ai-device-data:/app/src/data
      - esp-ai-firmware:/app/src/firmware
      - esp-ai-emos:/app/src/emos
      - esp-ai-logs:/app/logs

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M

    # 日志驱动配置（容器日志，与 /app/logs 应用日志互补）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # 健康检查（与 Dockerfile HEALTHCHECK 对齐）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/live').read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  esp-ai-data:
  esp-ai-device-data:
  esp-ai-firmware:
  esp-ai-emos:
  esp-ai-logs:
