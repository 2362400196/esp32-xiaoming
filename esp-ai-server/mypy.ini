[mypy]
python_version = 3.10
show_error_codes = true
pretty = true
explicit_package_bases = true

# Gradual convergence strategy: strict=false for now, enable checks incrementally
# Roadmap tracked in pyproject.toml

# Active checks
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

# Deferred (too many existing violations, will fix batch by batch):
# disallow_untyped_defs = true   -> target: 2026 Q2
# disallow_incomplete_defs = true -> target: 2026 Q2
# disallow_untyped_decorators = true -> target: 2026 Q3

[mypy-websockets.*]
ignore_missing_imports = true

[mypy-websocket.*]
ignore_missing_imports = true

