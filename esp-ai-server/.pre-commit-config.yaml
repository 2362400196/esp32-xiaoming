repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/ --config-file mypy.ini
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest tests/ --tb=short -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
