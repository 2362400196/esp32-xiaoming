<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气设置</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  background: #e9f0f4; color: #12212e; min-height: 100vh; padding: 20px;
}
.container { max-width: 420px; margin: 0 auto; }

/* 卡片 */
.card {
  background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px;
  box-shadow: 0 2px 10px rgba(23,52,74,0.06);
}

/* 标题 */
.card-title {
  font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-title .badge {
  font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px;
  background: #e0f2fe; color: #0369a1;
}

/* 表单 */
.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px; display: block;
}
.form-input { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; color: #12212e; background: #f8fafc; outline: none; transition: all .2s; }
.form-input:focus { border-color: #5eead4; background: #fff; box-shadow: 0 0 0 3px rgba(94,234,212,0.15); }
.form-input::placeholder { color: #94a3b8; }
.form-input-wrap { position: relative; }
.form-input-wrap .form-input { padding-right: 40px; }
.eye-btn {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px;
  color: #94a3b8; line-height: 1; display: flex; align-items: center;
}
.eye-btn:hover { color: #475569; }
.eye-btn svg { display: block; }
.form-tip { font-size: 12px; color: #94a3b8; margin-top: 4px; line-height: 1.4; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 20px; border: none; border-radius: 10px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .2s; width: 100%;
}
.btn-primary { background: #14b8a6; color: #fff; }
.btn-primary:hover { background: #0d9488; }
.btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
.btn-outline {
  background: transparent; color: #475569; border: 1.5px solid #e2e8f0;
}
.btn-outline:hover { background: #f1f5f9; border-color: #cbd5e1; }
.btn-sm { padding: 6px 14px; width: auto; display: inline-flex; }

/* 天气结果 */
.weather-result {
  text-align: center; padding: 8px 0;
}
.weather-temp {
  font-size: 48px; font-weight: 700; color: #0f172a; line-height: 1.1;
}
.weather-temp sup { font-size: 20px; }
.weather-desc { font-size: 15px; color: #475569; margin: 4px 0 2px; }
.weather-detail { font-size: 13px; color: #94a3b8; }
.weather-city { font-size: 14px; color: #5b6b78; margin-bottom: 4px; }

/* 加载 */
.loading { text-align: center; padding: 20px; color: #94a3b8; font-size: 14px; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 提示 */
.success { color: #059669; font-size: 13px; }
.error { color: #dc2626; font-size: 13px; }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #12212e; color: #fff; padding: 10px 24px; border-radius: 10px;
  font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.online { background: #10b981; }
.status-dot.offline { background: #94a3b8; }
</style>
</head>
<body>
<div class="container">
  <!-- 配置 -->
  <div class="card">
    <div class="card-title"><span>⚙</span> 高德 API 配置 <span class="badge">必填</span></div>
    <div class="form-group">
      <label class="form-label">API Key</label>
      <div class="form-input-wrap">
        <input class="form-input" id="apiKey" type="password" placeholder="在 https://console.amap.com 获取">
        <button class="eye-btn" id="eyeBtn" type="button" onclick="toggleEye()" aria-label="切换显示">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="form-tip">用于查询实时天气和预报数据</div>
    </div>
    <button class="btn btn-primary" id="saveBtn">保存配置</button>
  </div>

  <!-- 测试查询 -->
  <div class="card">
    <div class="card-title"><span>🔍</span> 测试查询</div>
    <div class="form-group">
      <label class="form-label">城市</label>
      <div style="display:flex;gap:8px">
        <input class="form-input" id="testCity" value="西安" placeholder="输入城市名" style="flex:1">
        <button class="btn btn-sm btn-outline" id="testBtn">查询</button>
      </div>
    </div>
    <div id="weatherResult"></div>
  </div>

  <!-- 状态 -->
  <div class="card" style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:13px;color:#475569">连接状态</span>
    <span id="statusText" style="font-size:13px;color:#94a3b8">检测中…</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '/api/v1'
const deviceId = new URLSearchParams(window.location.search).get('device_id')

// ── postMessage SDK：通过父应用代理 API 调用（自动携带 JWT，无需前端管 token） ──
let _apiId = 0
const _pending = {}

window.addEventListener('message', function(e) {
  const msg = typeof e.data === 'object' ? e.data : {}
  if (msg.type === 'apiResult' && _pending[msg.id]) {
    _pending[msg.id](msg)
    delete _pending[msg.id]
  }
})

async function sdkApi(path, opts = {}) {
  return new Promise((resolve, reject) => {
    const id = ++_apiId
    _pending[id] = (msg) => {
      if (msg.error) reject(new Error(msg.error))
      else resolve({ data: msg.data, status: msg.status })
    }
    window.parent.postMessage({ type: 'api', id, path, method: opts.method || 'GET', body: opts.body || null }, '*')
  })
}

async function api(path, opts = {}) {
  try {
    const result = await sdkApi(API_BASE + path, opts)
    return result.data
  } catch (e) {
    throw e
  }
}

function showToast(msg, isError = false) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.style.background = isError ? '#dc2626' : '#1e293b'
  el.classList.add('show')
  setTimeout(() => el.classList.remove('show'), 2500)
}

// --- 密码显隐切换 ---
function toggleEye() {
  const input = document.getElementById('apiKey')
  const icon = document.getElementById('eyeIcon')
  const isPassword = input.type === 'password'
  input.type = isPassword ? 'text' : 'password'
  icon.innerHTML = isPassword
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
}

// --- 加载配置（从插件 KV 存储读取，不经过主数据库） ---
async function loadConfig() {
  try {
    const res = await api(`/plugins/weather/tool/save_config`, {
      method: 'POST',
      body: { args: {}, device_id: deviceId },
    })
    if (res && res.code === 0 && res.data && res.data.ok && res.data.amap_key) {
      document.getElementById('apiKey').value = res.data.amap_key
    }
  } catch (e) {
    // 配置未设置是正常情况
  }
}

// --- 保存配置（通过插件工具 save_config 写入 KV 存储，不经过主数据库） ---
document.getElementById('saveBtn').addEventListener('click', async () => {
  const key = document.getElementById('apiKey').value.trim()
  if (!key) { showToast('请输入 API Key', true); return }
  const btn = document.getElementById('saveBtn')
  btn.disabled = true; btn.textContent = '保存中…'
  try {
    const res = await api(`/plugins/weather/tool/save_config`, {
      method: 'POST',
      body: { args: { amap_key: key }, device_id: deviceId },
    })
    if (res && res.code === 0 && res.data && res.data.ok) {
      showToast('配置已保存')
      await loadConfig()  // 回显已保存的 Key
      checkStatus()
    } else {
      showToast(`保存失败: ${(res && res.data && res.data.error) || '未知错误'}`, true)
    }
  } catch (e) {
    showToast(`保存失败: ${e.message}`, true)
  }
  btn.disabled = false; btn.textContent = '保存配置'
})

// --- 测试查询（通过通用插件工具接口调用 SDK，API Key 不暴露到浏览器） ---
document.getElementById('testBtn').addEventListener('click', async () => {
  const city = document.getElementById('testCity').value.trim() || '西安'
  const el = document.getElementById('weatherResult')
  el.innerHTML = '<div class="loading"><span class="spin">⟳</span> 查询中…</div>'
  try {
    const res = await api(`/plugins/weather/tool/test_weather_query`, {
      method: 'POST',
      body: { args: { city }, device_id: deviceId },
    })
    // res = {code: 0, message: "ok", data: {status: "1", lives: [...]}}
    const weatherData = res && res.code === 0 ? res.data : null
    if (!weatherData || weatherData.status !== '1' || !weatherData.lives || !weatherData.lives[0]) {
      el.innerHTML = `<div class="error">查询失败: ${(weatherData && weatherData.info) || '未知错误'}</div>`
      return
    }
    const live = weatherData.lives[0]
    el.innerHTML = `
      <div class="weather-result">
        <div class="weather-city">${live.city || city}</div>
        <div class="weather-temp">${live.temperature || '?'}<sup>°C</sup></div>
        <div class="weather-desc">${live.weather || ''}</div>
        <div class="weather-detail">${live.winddirection || ''} ${live.windpower || ''}级 · 湿度 ${live.humidity || '?'}%</div>
      </div>
    `
  } catch (e) {
    el.innerHTML = `<div class="error">查询失败: ${e.message}</div>`
  }
})

// --- 检查状态 ---
async function checkStatus() {
  const el = document.getElementById('statusText')
  try {
    const key = document.getElementById('apiKey').value.trim()
    if (!key) {
      el.innerHTML = '<span class="status-dot offline"></span>未配置 API Key'
      return
    }
    const res = await api(`/plugins/weather/tool/test_weather_query`, {
      method: 'POST',
      body: { args: { city: '西安' }, device_id: deviceId },
    })
    const weatherData = res && res.code === 0 ? res.data : null
    if (weatherData && weatherData.status === '1') {
      el.innerHTML = '<span class="status-dot online"></span>服务正常'
    } else {
      el.innerHTML = `<span class="status-dot offline"></span>${(weatherData && weatherData.info) || '服务异常'}`
    }
  } catch (e) {
    el.innerHTML = '<span class="status-dot offline"></span>网络不可达'
  }
}

try { window.parent.postMessage({ type: 'ready' }, '*') } catch(e) {}

loadConfig()
setTimeout(checkStatus, 500)
</script>
</body>
</html>
