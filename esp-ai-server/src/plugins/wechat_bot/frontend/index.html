<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信绑定</title>
<style>
:root {
  --mint: #10b981; --mint-deep: #059669; --mint-soft: rgba(16,185,129,0.1);
  --mint-border: rgba(16,185,129,0.25); --text-main: #1e293b; --text-sub: #64748b;
  --bg: #f0f5f0; --border: rgba(0,0,0,0.06); --danger: #ef4444; --danger-soft: rgba(239,68,68,0.1);
  --radius: 16px; --radius-sm: 10px; --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --glass: linear-gradient(155deg, rgba(255,255,255,0.85), rgba(255,255,255,0.55));
  --glass-border: rgba(255,255,255,0.6);
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text-main); min-height: 100vh;
}
.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

/* Hero Bar */
.hero-bar {
  position: relative; overflow: hidden; padding: 28px 30px; border-radius: var(--radius);
  background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(12px);
  margin-bottom: 20px;
}
.watermark {
  position: absolute; right: -8px; bottom: -18px; font-size: 90px; font-weight: 900;
  color: rgba(16,185,129,0.08); line-height: 1; pointer-events: none; user-select: none;
}
.hero-title { font-size: 22px; font-weight: 700; margin: 0; }
.hero-title .highlight { color: var(--mint-deep); }
.hero-sub { font-size: 13px; color: var(--text-sub); margin: 4px 0 0; }

/* QR Section */
.qr-section {
  display: flex; flex-direction: column; align-items: center; padding: 32px 24px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius);
  backdrop-filter: blur(12px); gap: 20px; margin-bottom: 20px;
}
.qr-header { text-align: center; }
.qr-header h3 { margin: 0 0 4px; font-size: 18px; }
.qr-hint { font-size: 13px; color: var(--text-sub); margin: 0; }
.qr-body { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.qr-placeholder { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px; color: var(--text-sub); }
.qr-image-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.qr-image { width: 220px; height: 220px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.qr-status { font-size: 13px; color: var(--text-sub); margin: 0; }
.qr-actions { display: flex; gap: 12px; }

/* Status Bar */
.status-bar {
  display: flex; align-items: center; gap: 8px; padding: 14px 20px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
  backdrop-filter: blur(12px); font-size: 13px; margin-bottom: 16px;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; }
.status-dot.online { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
.sep { color: var(--border); margin: 0 4px; }

/* Bindings */
.bind-list { display: flex; flex-direction: column; gap: 12px; }
.bind-card {
  display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius);
  backdrop-filter: blur(12px); gap: 12px;
}
.bind-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.bind-avatar {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
  justify-content: center; font-size: 16px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--mint), var(--mint-deep)); flex-shrink: 0;
}
.bind-detail { min-width: 0; }
.bind-device { font-size: 14px; font-weight: 600; margin: 0; }
.bind-chat { font-size: 12px; color: var(--text-sub); margin: 2px 0 0; }
.bind-group { color: var(--mint-deep); font-size: 11px; }
.bind-time { font-size: 11px; color: var(--text-sub); margin: 2px 0 0; opacity: 0.7; }
.bind-empty { text-align: center; padding: 40px 20px; color: var(--text-sub); }
.bind-empty p { margin: 4px 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px;
  font-size: 13px; font-weight: 600; border: none; border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.25s; text-decoration: none;
}
.btn-primary { background: var(--mint); color: #fff; }
.btn-primary:hover { background: var(--mint-deep); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text-main); padding: 6px 14px; }
.btn-ghost:hover { background: var(--mint-soft); }
.btn-outline {
  border: 1px solid var(--border); background: transparent; color: var(--text-main);
  padding: 8px 20px; font-size: 13px; border-radius: var(--radius-sm); cursor: pointer;
  transition: all 0.25s;
}
.btn-outline:hover { border-color: var(--mint-deep); color: var(--mint-deep); background: var(--mint-soft); }
.btn-sm { padding: 6px 16px; font-size: 12px; border-radius: var(--radius-sm); }
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--mint-soft);
  border-top-color: var(--mint-deep); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); z-index: 2000;
  animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="hero-bar">
    <span class="watermark">W</span>
    <div class="hero-text">
      <h2 class="hero-title">微信<span class="highlight">绑定</span></h2>
      <p class="hero-sub">扫码登录 · 设备绑定 · 消息管理</p>
    </div>
  </div>

  <!-- 未登录：二维码 -->
  <div id="qrSection" class="qr-section">
    <div class="qr-header">
      <h3>微信扫码登录</h3>
      <p class="qr-hint">使用微信扫描二维码，即可将设备与微信打通</p>
    </div>
    <div class="qr-body">
      <div id="qrPlaceholder" class="qr-placeholder" style="display:flex">
        <button class="btn btn-primary" onclick="startQr()">获取二维码</button>
      </div>
      <div id="qrImageWrap" class="qr-image-wrap" style="display:none">
        <img id="qrImage" class="qr-image" alt="微信二维码" />
        <p id="qrStatus" class="qr-status"></p>
        <button id="qrRegenBtn" class="btn btn-primary btn-sm" style="display:none" onclick="startQr()">重新生成</button>
      </div>
    </div>
    <div id="qrActions" class="qr-actions" style="display:none">
      <button class="btn btn-primary" onclick="applyToken()">应用 Token 并启动</button>
      <button class="btn btn-outline" onclick="cancelQr()">取消</button>
    </div>
  </div>

  <!-- 已登录：绑定管理 -->
  <div id="bindSection" style="display:none">
    <div class="status-bar">
      <span class="status-dot online"></span>
      <span>微信已登录</span>
      <span class="sep">|</span>
      <span class="text-sub" id="bindCount">共 0 个绑定</span>
      <button class="btn btn-ghost btn-sm" onclick="loadBindings()" style="margin-left:auto">刷新</button>
    </div>
    <div id="bindList" class="bind-list">
      <div class="bind-empty">
        <p>暂无绑定关系</p>
        <p class="text-sub" style="font-size:13px">在微信中向机器人发送消息，即可自动绑定设备</p>
      </div>
    </div>
  </div>
</div>

<script>
let qrPollTimer = null;
let botToken = '';
let bindings = [];

function getToken() { return localStorage.getItem('espai_token') || ''; }

function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

async function api(path, method = 'GET', body = null) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
    return await res.json();
  } catch (e) {
    return { code: 1, message: String(e) };
  }
}

async function startQr() {
  document.getElementById('qrPlaceholder').style.display = 'flex';
  document.getElementById('qrPlaceholder').innerHTML = '<div class="spinner"></div><p>正在生成二维码…</p>';
  document.getElementById('qrImageWrap').style.display = 'none';
  document.getElementById('qrActions').style.display = 'none';
  document.getElementById('qrRegenBtn').style.display = 'none';

  const res = await api('/api/v1/wechat/qr-start', 'POST');
  if (res.code === 0 && res.data) {
    document.getElementById('qrPlaceholder').style.display = 'none';
    document.getElementById('qrImageWrap').style.display = 'flex';
    document.getElementById('qrImage').src = res.data.qr_data_url || '';
    document.getElementById('qrStatus').textContent = '请使用微信扫描二维码';
    startPolling();
  } else {
    document.getElementById('qrPlaceholder').innerHTML = '<button class="btn btn-primary" onclick="startQr()">获取二维码</button>';
    showToast(res.message || '获取二维码失败');
  }
}

async function pollStatus() {
  try {
    const res = await api('/api/v1/wechat/qr-status');
    if (res.code === 0 && res.data) {
      if (res.data.configured) {
        document.getElementById('qrActions').style.display = 'none';
        stopPolling();
        showLoginState(true);
        loadBindings();
        return;
      }
      if (res.data.completed) {
        botToken = res.data.bot_token || '';
        document.getElementById('qrActions').style.display = 'flex';
        document.getElementById('qrStatus').textContent = '扫码成功，点击「应用 Token」启动';
        stopPolling();
        return;
      }
      if (res.data.active === false) {
        document.getElementById('qrRegenBtn').style.display = 'inline-flex';
        document.getElementById('qrStatus').textContent = '二维码已过期，请重新生成';
        stopPolling();
        return;
      }
    }
  } catch {}
}

function startPolling() {
  stopPolling();
  qrPollTimer = setInterval(pollStatus, 2000);
}

function stopPolling() {
  if (qrPollTimer) { clearInterval(qrPollTimer); qrPollTimer = null; }
}

async function applyToken() {
  const res = await api('/api/v1/wechat/apply-token', 'POST');
  if (res.code === 0) {
    botToken = '';
    showToast('微信已登录，轮询已启动');
    showLoginState(true);
    loadBindings();
  } else {
    showToast(res.message || '应用 Token 失败');
  }
}

async function cancelQr() {
  try { await api('/api/v1/wechat/qr-cancel', 'POST'); } catch {}
  stopPolling();
  document.getElementById('qrImageWrap').style.display = 'none';
  document.getElementById('qrActions').style.display = 'none';
  document.getElementById('qrPlaceholder').style.display = 'flex';
  document.getElementById('qrPlaceholder').innerHTML = '<button class="btn btn-primary" onclick="startQr()">获取二维码</button>';
  botToken = '';
}

async function loadBindings() {
  const res = await api('/api/v1/wechat/bindings');
  if (res.code === 0 && res.data) {
    bindings = res.data;
    renderBindings();
  }
}

function renderBindings() {
  document.getElementById('bindCount').textContent = '共 ' + bindings.length + ' 个绑定';
  const list = document.getElementById('bindList');
  if (bindings.length === 0) {
    list.innerHTML = '<div class="bind-empty"><p>暂无绑定关系</p><p class="text-sub" style="font-size:13px">在微信中向机器人发送消息，即可自动绑定设备</p></div>';
    return;
  }
  list.innerHTML = bindings.map(b => {
    const firstChar = (b.alias || b.wechat_chat_id || '?')[0].toUpperCase();
    const deviceKey = (b.device_key || '').slice(0, 20);
    const chatId = (b.wechat_chat_id || '').slice(0, 20);
    const time = b.bound_at ? formatTime(b.bound_at) : '—';
    const isGroup = b.wechat_group_id ? '<span class="bind-group">（群聊）</span>' : '';
    return `<div class="bind-card">
      <div class="bind-info">
        <div class="bind-avatar">${escapeHtml(firstChar)}</div>
        <div class="bind-detail">
          <p class="bind-device">设备：${escapeHtml(deviceKey) || '—'}</p>
          <p class="bind-chat">微信：${escapeHtml(chatId) || '—'} ${isGroup}</p>
          <p class="bind-time">绑定时间：${time}</p>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="unbind('${escapeHtml(b.device_key)}')">解绑</button>
    </div>`;
  }).join('');
}

async function unbind(deviceKey) {
  const res = await api('/api/v1/wechat/unbind', 'POST', { device_key: deviceKey });
  if (res.code === 0) {
    showToast('解绑成功');
    await loadBindings();
  } else {
    showToast(res.message || '解绑失败');
  }
}

function showLoginState(configured) {
  document.getElementById('qrSection').style.display = configured ? 'none' : 'flex';
  document.getElementById('bindSection').style.display = configured ? 'block' : 'none';
}

function formatTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 初始加载检查
async function init() {
  const res = await api('/api/v1/wechat/qr-status');
  if (res.code === 0 && res.data?.configured) {
    showLoginState(true);
    loadBindings();
  }
}

init();
</script>
</body>
</html>
