<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能系统</title>
<style>
:root{--mint:#10b981;--mint-deep:#059669;--mint-soft:rgba(16,185,129,0.1);--text-main:#1e293b;--text-sub:#64748b;--bg:#f0f5f0;--border:rgba(0,0,0,0.06);--radius:16px;--radius-sm:10px;--shadow:0 4px 20px rgba(0,0,0,0.06);--glass:linear-gradient(155deg,rgba(255,255,255,0.85),rgba(255,255,255,0.55));--glass-border:rgba(255,255,255,0.6)}
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.hero-bar{position:relative;overflow:hidden;padding:28px 30px;border-radius:var(--radius);background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);margin-bottom:20px}
.watermark{position:absolute;right:-8px;bottom:-18px;font-size:90px;font-weight:900;color:rgba(16,185,129,0.08);line-height:1;pointer-events:none;user-select:none}
.hero-title{font-size:22px;font-weight:700;margin:0}.highlight{color:var(--mint-deep)}
.hero-sub{font-size:13px;color:var(--text-sub);margin:4px 0 0}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;margin-bottom:12px;backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.skill-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.skill-item:last-child{border-bottom:none}
.skill-name{font-size:14px;font-weight:600}
.skill-desc{font-size:12px;color:var(--text-sub);margin-top:2px}
.skill-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.badge-on{background:var(--mint-soft);color:var(--mint-deep)}
.badge-off{background:rgba(0,0,0,0.05);color:var(--text-sub)}
.spinner{width:28px;height:28px;border:3px solid var(--mint-soft);border-top-color:var(--mint-deep);border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:all 0.25s}
.btn-primary{background:var(--mint);color:#fff}.btn-primary:hover{background:var(--mint-deep)}
.btn-ghost{background:transparent;color:var(--text-main)}.btn-ghost:hover{background:var(--mint-soft)}
</style>
</head>
<body>
<div class="container">
  <div class="hero-bar">
    <span class="watermark">S</span>
    <h2 class="hero-title">技能<span class="highlight">系统</span></h2>
    <p class="hero-sub">技能目录管理 · 创建 · 更新 · 删除 · 设备控制</p>
  </div>
  <div id="loading"><div class="spinner"></div></div>
  <div id="content" style="display:none">
    <div id="skillList"></div>
  </div>
</div>
<script>
let deviceMac='';
function getToken(){return localStorage.getItem('espai_token')||''}
async function api(path,method='GET',body=null){
  const token=getToken();const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  try{const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):null});return await r.json()}catch(e){return{code:1,message:String(e)}}
}

async function loadSkills(){
  document.getElementById('loading').style.display='block'
  document.getElementById('content').style.display='none'
  const res=await api('/api/v1/skills?device_id='+encodeURIComponent(deviceMac))
  document.getElementById('loading').style.display='none'
  document.getElementById('content').style.display='block'
  if(res.code===0&&res.data){
    renderSkills(res.data.skills||[])
  }
}

function renderSkills(skills){
  const list=document.getElementById('skillList')
  if(!skills||skills.length===0){
    list.innerHTML='<div class="card" style="text-align:center;padding:32px;color:var(--text-sub)">暂无技能</div>'
    return
  }
  list.innerHTML=skills.map(s=>{
    const disabled=s.disabled||false
    return `<div class="card">
      <div class="skill-item">
        <div>
          <div class="skill-name">${escapeHtml(s.name||s.skill_id||'')}</div>
          <div class="skill-desc">${escapeHtml(s.description||'')}</div>
        </div>
        <span class="skill-badge ${disabled?'badge-off':'badge-on'}">${disabled?'已禁用':'已启用'}</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:4px">
        <button class="btn btn-ghost" onclick="toggleSkill('${escapeHtml(s.skill_id)}',${disabled})">${disabled?'启用':'禁用'}</button>
      </div>
    </div>`
  }).join('')
}

async function toggleSkill(skillId,currentlyDisabled){
  const newDisabled=!currentlyDisabled
  const res=await api('/api/v1/skills/'+encodeURIComponent(skillId)+'/toggle?device_id='+encodeURIComponent(deviceMac)+'&disabled='+newDisabled,'POST')
  if(res.code===0)loadSkills()
}

function escapeHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

window.addEventListener('message',function(e){
  try{const m=typeof e.data==='object'?e.data:JSON.parse(e.data)
  if(m.type==='deviceChanged'&&m.device){
    deviceMac=m.device.device_id||m.device.id||m.device.mac||''
    if(deviceMac)loadSkills()
  }}catch{}
})

try{window.parent.postMessage({type:'ready'},'*')}catch(e){}

(function(){const did=new URLSearchParams(window.location.search).get('device_id');if(did){deviceMac=did;loadSkills()}})();
</script>
</body>
</html>
