<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长系统</title>
<style>
:root{--mint:#10b981;--mint-deep:#059669;--mint-soft:rgba(16,185,129,0.1);--text-main:#1e293b;--text-sub:#64748b;--bg:#f0f5f0;--border:rgba(0,0,0,0.06);--radius:16px;--radius-sm:10px;--shadow:0 4px 20px rgba(0,0,0,0.06);--glass:linear-gradient(155deg,rgba(255,255,255,0.85),rgba(255,255,255,0.55));--glass-border:rgba(255,255,255,0.6)}
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh}
.container{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.hero-bar{position:relative;overflow:hidden;padding:28px 30px;border-radius:var(--radius);background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);margin-bottom:20px}
.watermark{position:absolute;right:-8px;bottom:-18px;font-size:90px;font-weight:900;color:rgba(16,185,129,0.08);line-height:1;pointer-events:none;user-select:none}
.hero-title{font-size:22px;font-weight:700;margin:0}.highlight{color:var(--mint-deep)}
.hero-sub{font-size:13px;color:var(--text-sub);margin:4px 0 0}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;margin-bottom:12px;backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:rgba(0,0,0,0.02);border-radius:12px;padding:16px;text-align:center}
.stat-value{font-size:26px;font-weight:800;color:var(--mint-deep);margin:0 0 4px}
.stat-label{font-size:12px;color:var(--text-sub);margin:0}
.spinner{width:28px;height:28px;border:3px solid var(--mint-soft);border-top-color:var(--mint-deep);border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="hero-bar">
    <span class="watermark">G</span>
    <h2 class="hero-title">成长<span class="highlight">系统</span></h2>
    <p class="hero-sub">用户画像分析 · 情绪检测 · 日记自动生成 · 自学习技能</p>
  </div>
  <div id="loading"><div class="spinner"></div></div>
  <div id="content" style="display:none">
    <div class="stat-grid">
      <div class="stat-card"><p class="stat-value" id="diaryCount">--</p><p class="stat-label">日记篇数</p></div>
      <div class="stat-card"><p class="stat-value" id="emotionCount">--</p><p class="stat-label">情绪记录</p></div>
      <div class="stat-card"><p class="stat-value" id="skillCount">--</p><p class="stat-label">学习技能</p></div>
      <div class="stat-card"><p class="stat-value" id="activeDays">--</p><p class="stat-label">活跃天数</p></div>
    </div>
    <div class="card" id="profileCard">
      <h3 style="font-size:14px;font-weight:700;margin:0 0 8px">用户画像</h3>
      <div id="profileContent" style="font-size:13px;color:var(--text-sub)">暂无数据</div>
    </div>
  </div>
</div>
<script>
let deviceMac = '';
function getToken(){return localStorage.getItem('espai_token')||''}
async function api(path,method='GET',body=null){
  const token=getToken();const headers={'Content-Type':'application/json'};
  if(token)headers['Authorization']='Bearer '+token;
  try{const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):null});return await r.json()}catch(e){return{code:1,message:String(e)}}
}
async function loadData(){
  if(!deviceMac){document.getElementById('loading').style.display='none';return}
  document.getElementById('loading').style.display='block'
  document.getElementById('content').style.display='none'
  const [profileRes, diaryRes] = await Promise.all([
    api('/api/v1/growth/profile/'+encodeURIComponent(deviceMac)),
    api('/api/v1/growth/diary/'+encodeURIComponent(deviceMac)+'?limit=999')
  ])
  document.getElementById('loading').style.display='none'
  document.getElementById('content').style.display='block'
  const diaryCount = diaryRes.code===0 ? (diaryRes.data?.count||0) : 0
  document.getElementById('diaryCount').textContent = diaryCount
  if(profileRes.code===0 && profileRes.data){
    const p = profileRes.data.profile || {}
    const es = profileRes.data.emotion_summary || {}
    document.getElementById('emotionCount').textContent = es.total_records || 0
    document.getElementById('skillCount').textContent = p.learned_skills_count || p.learned_skills?.length || 0
    document.getElementById('activeDays').textContent = p.active_days || p.days_active || 0
    const traits = p.personality_traits || p.traits || []
    const interests = p.interests || []
    let html = ''
    if(traits.length) html += '<div style="margin-bottom:6px"><strong>性格特征：</strong>'+traits.join('、')+'</div>'
    if(interests.length) html += '<div><strong>兴趣爱好：</strong>'+interests.join('、')+'</div>'
    if(!html) html = '暂无画像数据'
    document.getElementById('profileContent').innerHTML = html
  }else{
    document.getElementById('emotionCount').textContent = '0'
    document.getElementById('skillCount').textContent = '0'
    document.getElementById('activeDays').textContent = '0'
  }
}
window.addEventListener('message',function(e){
  try{const m=typeof e.data==='object'?e.data:JSON.parse(e.data)
  if(m.type==='deviceChanged'&&m.device){
    deviceMac=m.device.device_id||m.device.id||m.device.mac||''
    if(deviceMac)loadData()
  }}catch{}
})
try{window.parent.postMessage({type:'ready'},'*')}catch(e){}

// 从 URL 参数读取设备 ID
(function(){const did=new URLSearchParams(window.location.search).get('device_id');if(did){deviceMac=did;loadData()}})();
</script>
</body>
</html>
