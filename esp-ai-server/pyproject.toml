    "torchaudio==2.11.0",
    "openai==2.32.0",
    "colorama==0.4.6",
    "mcp==1.27.0",
    "fastmcp==2.12.4",
    "python-dotenv==1.2.2",
    "pydantic-settings==2.14.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "pillow>=12.2.0",
    "packaging>=26.2",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "passlib>=1.7.4",
    "pyjwt==2.12.1",
    "bcrypt>=5.0.0",
    "qrcode[pil]==8.1",
    "aiofiles==24.1.0",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.1.8",
    "cryptography==47.0.0",
    "cyclopts==4.11.0",
    "distro==1.9.0",
    "dnspython==2.8.0",
    "docstring-parser==0.18.0",
    "docutils==0.22.4",
    "email-validator==2.3.0",
    "exceptiongroup==1.3.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.7.1",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.11",
    "jinja2==3.1.6",
    "jiter==0.14.0",
    "jsonschema==4.26.0",
    "jsonschema-path==0.4.6",
    "jsonschema-specifications==2025.9.1",
    "lazy-object-proxy==1.12.0",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
