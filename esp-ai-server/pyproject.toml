    "mpmath==1.3.0",
    "networkx==3.4.2",
    "openapi-core==0.23.1",
    "openapi-pydantic==0.5.1",
    "openapi-schema-validator==0.8.1",
    "openapi-spec-validator==0.8.5",
    "pathable==0.5.0",
    "pycparser==3.0",
    "pydantic==2.13.3",
    "pydantic-core==2.46.3",
    "python-multipart==0.0.27",
    "pywin32==311",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.33.1",
    "rich==15.0.0",
    "rpds-py==0.30.0",
    "sniffio==1.3.1",
    "sse-starlette==3.4.1",
    "starlette==1.0.0",
